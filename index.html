const defaults={theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',palette:'blue',size:'16',font:'system',density:'comfortable',contrast:false};
let preferences={...defaults};try{const v=JSON.parse(localStorage.getItem('recetedestek.settings.v1')||'null');if(v&&typeof v==='object')preferences={...defaults,...v};}catch{}
function sanitizePreferences(){const lists={theme:['light','dark','black'],palette:['blue','teal','plum'],size:['16','18','20'],font:['system','serif'],density:['comfortable','compact']};for(const [k,values]of Object.entries(lists)){if(!values.includes(preferences[k]))preferences[k]=defaults[k];}preferences.contrast=preferences.contrast===true;}
function applyPreferences(){sanitizePreferences();const root=document.documentElement;root.dataset.theme=preferences.theme;root.dataset.palette=preferences.palette;root.dataset.contrast=String(preferences.contrast);root.style.setProperty('--size',preferences.size+'px');root.style.setProperty('--font',preferences.font==='serif'?'Georgia,"Times New Roman",serif':'system-ui,-apple-system,"Segoe UI",sans-serif');root.style.setProperty('--pad',preferences.density==='compact'?'12px':'18px');document.querySelector('meta[name="theme-color"]').content=preferences.theme==='black'?'#000000':preferences.theme==='dark'?'#111820':'#f5f7fa';}
applyPreferences();
const state={query:'',category:'all',risks:new Set(),notes:new Map(),scrollY:0,patientOpen:false,brandChoices:new Map(),previousPage:null};
const main=document.getElementById('main');
const navLabels={tanilar:['list','Tanılar'],ayarlar:['settings','Ayarlar'],hakkinda:['info','Hakkında']};

function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.hidden=true;},4500);}
function sourceMarkup(keys){return '<ul class="source-list">'+[...new Set(keys)].map(k=>{const s=SOURCES[k];return '<li><span class="source-name">'+esc(s.name)+'</span>'+(s.date?' <span class="small muted">· '+esc(s.date)+'</span>':'')+'<span class="source-address">'+esc(s.url)+'</span></li>';}).join('')+'</ul>';}
function previewNotice(){return '';}

function patientMarkup(){return '<button class="button" type="button" id="patient-picker" aria-haspopup="dialog">'+icon('info')+'<span>Hasta Durumu <span class="small muted" id="risk-count">'+(state.risks.size?'· '+state.risks.size+' seçim':'· İsteğe bağlı')+'</span></span>'+icon('arrow')+'</button>';}
function categoryButton(){const c=CATEGORIES.find(c=>c.id===state.category);return '<button class="button" type="button" id="category-picker" aria-haspopup="dialog">'+icon('list')+'<span>Bölüm: '+esc(c?c.name:'Tüm Bölümler')+'</span>'+icon('arrow')+'</button>';}
function openPicker(kind){const dialog=document.getElementById('selection-dialog');const title=kind==='category'?'Bölüm Seç':'Hasta Durumu';dialog.innerHTML='<div class="dialog-head"><h2 id="dialog-title">'+title+'</h2><button class="button small" type="button" id="close-picker" aria-label="Pencereyi kapat">'+icon('close')+'</button></div><div class="dialog-body">'+(kind==='category'?'<div class="picker-list">'+[{id:'all',name:'Tüm Bölümler'},...CATEGORIES].map(c=>'<button class="button" type="button" data-category-choice="'+c.id+'" aria-pressed="'+(state.category===c.id)+'" '+(c.id!=='all'?'style="'+categoryStyle(c.id)+'"':'')+'>'+esc(c.name)+'</button>').join('')+'</div>':'<p class="small muted">Seçimler yalnızca bu oturumda tutulur. İşaretlenmeyen bir durumun olmadığı varsayılmaz.</p><div class="picker-list">'+RISKS.map(([id,label])=>'<label class="check-row risk-option"><input type="checkbox" data-risk="'+id+'" '+(state.risks.has(id)?'checked':'')+'>'+esc(label)+'</label>').join('')+'</div><div class="dialog-actions"><button class="button" type="button" id="clear-risks">Seçimleri Temizle</button><button class="button primary" type="button" id="done-picker">Tamam</button></div>')+'</div>';
 document.getElementById('close-picker').onclick=()=>dialog.close();document.getElementById('done-picker')?.addEventListener('click',()=>dialog.close());

function refreshRiskCount(){const count=document.getElementById('risk-count');if(count)count.textContent=state.risks.size?'· '+state.risks.size+' seçim':'· İsteğe bağlı';}
function attachPatient(){document.getElementById('patient-picker')?.addEventListener('click',()=>openPicker('patient'));}

function renderRiskNotice(){const el=document.getElementById('risk-notice');if(!el)return;const d=DIAGNOSES.find(x=>x.id===state.lastDiagnosis);const hasClinical=d&&clinicalPlans(d).length>0;el.hidden=state.risks.size===0;if(!state.risks.size)el.innerHTML='';else{const labels=RISKS.filter(([id])=>state.risks.has(id)).map(x=>x[1]);el.innerHTML='<strong>Seçili durumlar: '+esc(labels.join(', '))+'</strong><p class="small">'+(hasClinical?'Kaynakta tanımlı uyarılar aşağıdaki etken maddelerde gösterilir. Bireysel uygunluk veya otomatik doz hesabı yapılmaz.':'Bu tanı için ilaçlara özgü eşleştirme henüz hazırlanmadı. Otomatik ilaç veya doz önerisi verilmez.')+'</p>';}const target=document.getElementById('clinical-plan-list');if(target&&d){target.innerHTML=renderClinicalPlans(d);attachBrandChoices(d);}}
function agentRiskStatus(agentId,riskIds){const a=AGENTS[agentId];const selected=[...riskIds];const entries=selected.filter(r=>a.risks[r]).map(r=>({id:r,...a.risks[r]}));return {hold:entries.some(x=>x.hold===true),entries,unmapped:selected.filter(r=>!a.risks[r])};}

function brandOptions(agent,allowed){return (BRANDS[agent]||[]).filter(b=>b.barcode&&b.priceDate&&b.kub&&SOURCES[b.kub]&&(!allowed||allowed.includes(b.id))).slice(0,3);}
function selectedBrand(d,index,p){const options=brandOptions(p.agent,p.brandIds);return options.find(b=>b.id===state.brandChoices.get(d.id+':'+index))||options[0];}
function quantityText(p,b){if(!b)return '';if(p.quantity&&p.quantity.unit===b.unit){const boxes=Math.ceil(p.quantity.total/b.size);return boxes+' kutu ('+esc(b.pack)+' / kutu). '+esc(p.quantity.note);}return esc(p.quantityNote||'Kutu adedi hekimce belirlenir.');}
function renderClinicalPlans(d){return clinicalPlans(d).map((p,i)=>{const a=AGENTS[p.agent],risk=agentRiskStatus(p.agent,state.risks),brands=brandOptions(p.agent,p.brandIds),b=selectedBrand(d,i,p);if(!b)return '';const sourceIds=[...new Set([a.source,b.kub,...p.sources])];return '<section class="option sample-card" data-clinical-agent="'+p.agent+'"><h4>'+icon(a.form)+' '+esc(a.name)+'</h4><p class="small muted">'+esc(p.role)+(a.equivalence?' · '+esc(a.equivalence):'')+'</p>'+(p.condition?'<p class="small">'+esc(p.condition)+'</p>':'')+'<div class="brand-select"><label for="brand-'+i+'">Piyasa adı'+(brands.length>1?' — birini seçin':'')+'</label><select id="brand-'+i+'" data-brand-choice="'+i+'">'+brands.map(x=>'<option value="'+x.id+'" '+(x.id===b.id?'selected':'')+'>'+esc(x.name)+' · '+esc(x.pack)+'</option>').join('')+'</select><p class="small section-gap"><strong>Seçili ürün:</strong> '+esc(b.name)+' · '+esc(b.pack)+'</p>'+(brands.length>1?'<p class="selection-note">Bunlar aynı etken madde için marka seçenekleridir; birlikte kullanılmaz.</p>':'')+'</div>'+(risk.entries.length?'<ul class="small">'+risk.entries.map(r=>'<li>'+esc(RISKS.find(x=>x[0]===r.id)[1])+': '+esc(r.text)+'</li>').join('')+'</ul>':'')+(risk.unmapped.length?'<p class="small muted">'+esc(risk.unmapped.map(r=>RISKS.find(x=>x[0]===r)[1]).join(', '))+': Bireysel değerlendirme gerekir; otomatik doz uyarlaması yapılmaz.</p>':'')+(risk.hold?'<p class="notice danger small" data-dose-held="true">Seçili hasta durumu için standart doz gösterilmez. Alternatif bir ilacın otomatik olarak uygun olduğu anlamına gelmez.</p>':'<dl class="recipe-fields clinical-dose"><dt>Doz</dt><dd>'+esc(p.dose||a.dose)+'</dd><dt>Kullanım sıklığı</dt><dd>'+esc(p.frequency||a.frequency)+'</dd><dt>Süre</dt><dd>'+esc(p.duration)+'</dd><dt>Kutu adedi</dt><dd>'+quantityText(p,b)+'</dd></dl>')+'<p class="small muted">'+esc(a.warnings.join(' '))+'</p><details><summary class="small">Kaynak ve ürün bilgisi</summary><p class="small section-gap">'+esc(b.name)+' · '+esc(b.pack)+'<br>Barkod: '+esc(b.barcode)+'<br>SKRS: 20 Ekim 2026 aktif kayıt<br>Ürün/fiyat kaydı: '+esc(b.priceDate)+' · Kontrol: '+esc(b.checkedOn||'2026-10-27')+'</p><p class="source-address">'+esc(b.source)+'</p>'+sourceMarkup(sourceIds)+'</details></section>';}).join('');}
function attachBrandChoices(d){document.querySelectorAll('[data-brand-choice]').forEach(el=>el.addEventListener('change',()=>{const i=Number(el.dataset.brandChoice);const p=clinicalPlans(d)[i];if(!brandOptions(p.agent,p.brandIds).some(b=>b.id===el.value))return;state.brandChoices.set(d.id+':'+i,el.value);const target=document.getElementById('clinical-plan-list');target.innerHTML=renderClinicalPlans(d);attachBrandChoices(d);document.getElementById('brand-'+i)?.focus({preventScroll:true});}));}
function clinicalSection(d){if(!clinicalPlans(d).length)return '<section class="panel"><h3>Örnek Reçeteler</h3><p>Bu tanı için henüz örnek reçete eklenmedi.</p></section>';return '<section class="panel" aria-labelledby="clinical-title"><h3 id="clinical-title">Örnek Reçete Seçenekleri</h3><p class="small muted">Tanısı doğrulanmış, komplikasyonsuz, 18 yaş ve üstü olgular için. Her kart ayrı bir seçenektir; birlikte kullanılacak ilaç listesi değildir.</p><div id="clinical-plan-list">'+renderClinicalPlans(d)+'</div></section>';}

}

 document.getElementById('share').addEventListener('click',()=>shareDiagnosis(d));
}
function renderPrescription(p){return '<div class="option"><h4>'+esc(p.title)+'</h4>'+p.medicines.map(m=>'<p><strong>'+esc(m.substance)+'</strong> · '+esc(m.brand)+' <span aria-label="Doğrulanmış ürün">✓</span></p><p>'+esc(m.dose)+' · '+esc(m.frequency)+' · '+esc(m.duration)+' · '+esc(m.boxes)+' kutu</p>').join('')+'<small>Doğrulama: '+esc(p.verification.reviewedOn)+'</small></div>';}
async function shareDiagnosis(d){const url=new URL(location.href);url.hash='tani/'+d.id;url.search='';if(navigator.share&&['https:','http:'].includes(url.protocol)){try{await navigator.share({title:d.title+' — Reçete Destek',url:url.href});return;}catch(e){if(e.name==='AbortError')return;}}const fallback=document.getElementById('share-fallback');fallback.hidden=false;const input=document.getElementById('share-url');input.value=url.href;input.focus();input.select();}

function renderSettings(){main.innerHTML='<h2>Ayarlar</h2><p class="muted">Görünüm tercihleri yalnızca bu tarayıcıya kaydedilir.</p><section class="panel"><h3>Tema</h3><div class="themes" aria-label="Tema seçimi">'+[['light','Açık Tema','sun'],['dark','Koyu Tema','moon'],['black','Saf Siyah Tema','black']].map(([v,l,i])=>'<button type="button" class="theme-button" data-theme-choice="'+v+'" aria-label="'+l+'" title="'+l+'" aria-pressed="'+(preferences.theme===v)+'">'+icon(i)+'</button>').join('')+'</div><p class="small muted section-gap">Güneş: açık · Ay: koyu · Kare: saf siyah</p></section><section class="panel settings-grid"><div><label for="palette">Renk Paleti</label><select id="palette" data-setting="palette"><option value="blue">Mavi</option><option value="teal">Yeşil</option><option value="plum">Mor</option></select></div><div><label for="text-size">Yazı Boyutu</label><select id="text-size" data-setting="size"><option value="16">Standart</option><option value="18">Büyük</option><option value="20">Çok Büyük</option></select></div><div><label for="font-family">Yazı Stili</label><select id="font-family" data-setting="font"><option value="system">Sistem Yazısı</option><option value="serif">Serif Yazı</option></select></div><div><label for="density">Liste Yoğunluğu</label><select id="density" data-setting="density"><option value="comfortable">Rahat</option><option value="compact">Sık</option></select></div><div><label class="check-row" for="contrast"><input id="contrast" type="checkbox" '+(preferences.contrast?'checked':'')+'>Renk Körlüğü Modu</label><p class="small muted">Bölüm adları korunur; ayırım için renk yerine kenarlık da kullanılır.</p></div></section><button type="button" class="button" id="reset-settings">Görünüm Ayarlarını Sıfırla</button><p class="small muted section-gap" id="settings-state" role="status"></p>';
 document.querySelectorAll('[data-setting]').forEach(s=>{s.value=preferences[s.dataset.setting];s.addEventListener('change',()=>{preferences[s.dataset.setting]=s.value;savePreferences();});});
 document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>{preferences.theme=b.dataset.themeChoice;savePreferences();document.querySelectorAll('[data-theme-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.themeChoice===preferences.theme)));}));
 document.getElementById('contrast').addEventListener('change',e=>{preferences.contrast=e.target.checked;savePreferences();});
 document.getElementById('reset-settings').addEventListener('click',()=>{preferences={...defaults};savePreferences();renderSettings();toast('Görünüm ayarları sıfırlandı.');});
}
function savePreferences(){applyPreferences();let text='Görünüm kaydedildi.';try{localStorage.setItem('recetedestek.settings.v1',JSON.stringify(preferences));}catch{text='Tarayıcı kaydetmeye izin vermedi; görünüm yalnızca bu oturumda uygulanıyor.';}const el=document.getElementById('settings-state');if(el)el.textContent=text;}

function renderAbout(){main.innerHTML='<h2>Hakkında</h2><section class="panel"><h3>Reçete Destek</h3><p><strong>Karar destek aracıdır, son karar hekime aittir.</strong></p><p class="small">Yalnızca hekimler için, acilden taburcu edilebilen erişkin olgulara yönelik örnek reçeteler. Kuru göz kartı, aile hekimi koşuluyla ayrı bir örnek içerir. Muayene, bireysel risk değerlendirmesi ve güncel yerel tedavi yaklaşımı esastır.</p><p class="small muted">'+DIAGNOSES.length+' tanı · '+clinicalDiagnosisCount()+' tanıda örnek reçete. Kapsam erişkin hastadır; çocuk dozları içermez. Raporlu kronik tedavi yenileme kapsam dışıdır.</p></section><section class="panel"><h3>Kaynaklar ve Kontrol Kapsamı</h3><p class="small">Örneklerde etken madde, form, kullanım bilgisi ve ambalaj kaynaklardan derlenir. Örnek reçete gösterimi, klinik onay veya SGK geri ödeme garantisi değildir.</p><p class="small muted">Ürün kontrolleri 27–28 Ekim 2026; SKRS dosyası 20 Ekim 2026. Ürün/fiyat kayıtlarının kendi tarihleri her ilaçta kaynak alanında gösterilir. Resmî güncel fiyat dosyasına erişim ve fiziksel eczane stoğu teyidi tamamlanmamıştır. Ürün ve endikasyona göre güncel SUT/Medula koşulları reçete sırasında ayrıca kontrol edilir; bu sürümde tam doğrulama işareti kullanılmaz.</p><p class="small muted">Her etken maddede en fazla üç piyasa adı vardır. Form veya güç farklıysa otomatik ikame yapılmaz. Hasta durumu seçimleri bazı standart dozları gizler; işaretlenmeyen risk yok sayılmaz. Krem/jel tüp adedi uygulama alanına bağlıdır; sabit bir kutunun tam küre yeterli olduğu varsayılmaz.</p></section><section class="panel"><h3>Gizlilik</h3><p class="small">Uygulama kodu veri toplamaz ve sunucuya veri göndermez; analitik, reklam veya izleyici içermez. Görünüm tercihleri cihazdaki yerel depolamada tutulur. Notlar, hasta durumu ve marka seçimleri yalnızca açık sayfanın belleğindedir; yenilemede silinir. Hasta kimlik bilgisi girilmemelidir.</p><p class="small muted">GitHub Pages barındırma hizmetinin teknik erişim kayıtları uygulama kodundan ayrıdır.</p></section><section class="panel"><h3>Simgeler</h3><div class="legend">'+[['tablet','Tablet / kapsül'],['syrup','Şurup / solüsyon'],['cream','Krem / jel'],['drop','Damla'],['injection','Enjeksiyon']].map(([i,l])=>'<span>'+icon(i)+esc(l)+'</span>').join('')+'</div></section><section class="panel"><h3>Telif ve Lisanslar</h3><p class="small">Telif sahibi: <strong>Belirlenecek</strong><br>Kaynak kodu lisansı: <strong>Belirlenecek</strong></p><p class="small muted">Harici kod/font, marka logosu veya kutu görseli kullanılmaz. Kaynak metinleri dağıtılmaz; olgusal bilgiler referanslarıyla özetlenir.</p></section><details class="panel"><summary><strong>Araştırma Kaynakları</strong></summary><p class="small muted section-gap">Adresler referans metnidir; uygulama dışarı otomatik istek yapmaz.</p>'+sourceMarkup(Object.keys(SOURCES))+'</details><p class="small muted">Sürüm '+esc(RELEASE.version)+' · 28 Ekim 2026</p>';}

function route(){document.getElementById('selection-dialog')?.close();let hash=location.hash.slice(1);const [page,id]=hash.split('/');const key=page||'tanilar';const home=key==='tanilar';document.querySelectorAll('nav a').forEach(a=>{const current=a.dataset.page===(key==='tani'?'tanilar':key);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(home)renderHome();else if(key==='tani')renderDetail(id);else if(key==='ayarlar')renderSettings();else if(key==='hakkinda')renderAbout();else{main.innerHTML='<div class="panel"><h2>Sayfa Bulunamadı</h2><a href="#tanilar" class="button">Tanılara Dön</a></div>';}
 const previous=state.previousPage;state.previousPage=key;
 requestAnimationFrame(()=>{if(home&&previous!==null){window.scrollTo(0,state.scrollY);const link=document.querySelector('[data-diagnosis="'+(state.lastDiagnosis||'')+'"]');if(link)link.focus({preventScroll:true});}else{window.scrollTo(0,0);if(previous!==null)main.focus({preventScroll:true});}});
 document.title=(key==='tani'?(DIAGNOSES.find(d=>d.id===id)?.title||'Tanı'):(navLabels[key]?.[1]||'Tanılar'))+' — Reçete Destek';
 if(key==='tani'&&DIAGNOSES.some(d=>d.id===id))state.lastDiagnosis=id;
}
// Ana sayfadan ayarlar/hakkında gibi bir sayfaya geçişte de liste konumu korunur.
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>{if(state.previousPage==='tanilar')state.scrollY=window.scrollY;}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView();});
window.addEventListener('hashchange',route);history.scrollRestoration='manual';route();
</script>
</body>
</html>
